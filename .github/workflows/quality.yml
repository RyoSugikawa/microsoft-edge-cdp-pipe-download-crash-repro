name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile playwright_repro.py tools/inspect_minidump.py
